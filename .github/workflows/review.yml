# Образец курса (45.1–45.2): ИИ-ревью каждого PR агентом Claude Code через шлюз платформы.
# Секрет GATEWAY_KEY — ключ шлюза для CI. Агент пишет только комментарии: права — на чтение кода и запись в PR.
name: review
on:
  pull_request:
jobs:
  review:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.GATEWAY_KEY }}
          # токен workflow: без него action ищет приложение Anthropic на GitHub (OIDC, id-token)
          github_token: ${{ github.token }}
          # адрес шлюза и модель курса — по требованию платформы Ш13 (шлюз пускает только модель курса)
          settings: |
            {"env": {"ANTHROPIC_BASE_URL": "https://llm.javarush.com", "ANTHROPIC_MODEL": "claude-course-fast"}}
          # что агенту можно: читать PR и писать замечания к строкам и общий комментарий
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            Проведи ревью этого Pull Request в библиотеке translit: файлы алфавитов в alphabets/, настройка, README.
            Замечания — комментариями к строкам; итог — одним общим комментарием в PR; код в src/ — от курса, его не обсуждай.
