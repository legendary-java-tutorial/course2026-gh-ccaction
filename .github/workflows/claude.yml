# Проба 45.4: правка по комментарию @claude в PR — агент пишет в ветку PR через шлюз курса.
name: claude
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.GATEWAY_KEY }}
          github_token: ${{ github.token }}
          settings: |
            {"env": {"ANTHROPIC_BASE_URL": "https://llm.javarush.com", "ANTHROPIC_MODEL": "claude-course-fast"}}
          show_full_output: true
